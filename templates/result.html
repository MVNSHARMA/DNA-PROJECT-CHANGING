<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Result</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-lg p-4 text-center">
            <h2 class="text-primary">🩺 Prediction Result</h2>
            <p class="lead">The uploaded X-ray was classified as:</p>
            
            <h3 class="text-success"><b>{{ label }}</b></h3>
            <p class="text-muted">Confidence: {{ (confidence * 100) | round(1) }}%</p>
            
            <div class="mt-3">
                <h5>Class Distribution:</h5>
                <div class="row justify-content-center">
                    {% for class_name, prob in dist[:3] %}
                    <div class="col-md-4 mb-2">
                        <div class="card">
                            <div class="card-body">
                                <strong>{{ class_name }}</strong><br>
                                <span class="badge bg-primary">{{ (prob * 100) | round(1) }}%</span>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <img src="{{ url_for('static', filename='uploads/' + filename) }}" 
                 alt="Uploaded X-ray" class="img-fluid rounded mt-3 shadow">

            <div class="mt-4">
                <a href="/" class="btn btn-primary">🔙 Upload Another X-ray</a>
            </div>
        </div>
    </div>
</body>
</html>
